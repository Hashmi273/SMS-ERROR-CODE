      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#1268FF" />
      <stop offset="100%" stop-color="#071A3A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
